<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed</title>
<meta name="description" content="A few videos worth watching today, then go do something else.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feed">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top">
    <div class="nudge" id="nudge" hidden></div>
    <div class="meter" id="meter">
      <div class="meter-row">
        <div>
          <div class="meter-label" id="day-label">Today</div>
          <div class="meter-used" id="used-label"></div>
        </div>
        <div class="meter-left"><span id="left-num">–</span><span class="unit"> min left</span></div>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
  </header>

  <main id="feed-view">
    <div class="done" id="done" hidden>
      <p class="done-nudge" id="done-nudge"></p>
      <p class="done-note">Done for today. Feed reopens tomorrow.</p>
    </div>
    <p class="note" id="note" hidden></p>
    <ol class="picks" id="picks"></ol>
  </main>

  <section id="watch-view" hidden>
    <button class="back" id="back" type="button">← Feed</button>
    <div class="stage" id="stage">
      <div id="player"></div>
      <div class="guard guard-top" aria-hidden="true"></div>
      <div class="guard guard-corner" id="guard-corner" aria-hidden="true"></div>
      <div class="guard guard-end" id="guard-end" hidden>
        <button type="button" id="guard-toggle" class="pill">Pause</button>
      </div>
      <div class="cover" id="cover" hidden>
        <p id="cover-text"></p>
        <button type="button" id="cover-btn" class="pill"></button>
      </div>
    </div>
    <div class="watch-meta">
      <div class="thread" id="w-thread"></div>
      <h1 id="w-title"></h1>
      <p class="channel" id="w-channel"></p>
      <p class="why" id="w-why"></p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
