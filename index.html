<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Feed</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --border: #262a33;
    --text: #e8eaf0; --muted: #8a90a0; --accent: #ff5a4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .date { color: var(--muted); margin-top: 4px; font-size: 15px; }
  .progress { min-width: 200px; text-align: right; }
  .progress-label { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .duration {
    position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 6px;
    background: rgba(0,0,0,.8); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .check {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(15,17,21,.55);
  }
  .check span {
    width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff;
  }
  .card.watched { opacity: .45; }
  .card.watched .check { display: flex; }
  .body { padding: 14px 16px 16px; }
  .title {
    margin: 0 0 10px; font-size: 16px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .channel { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
    border: 1px solid currentColor;
  }
  .message {
    text-align: center; color: var(--muted); padding: 48px 16px; font-size: 17px;
  }
  .done { color: var(--text); margin-top: 32px; padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
  @media (max-width: 520px) {
    .progress { text-align: left; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Today's Feed</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="progress">
      <div class="progress-label" id="progress-label"></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="message done" id="done" hidden>That's it for today. New picks show up tomorrow morning.</div>
  <div class="message" id="status" hidden></div>
</main>
<script>
  const PALETTE = ["#ff5a4e", "#4ea8ff", "#5ed39a", "#f5b83d", "#b48cff", "#ff7fbf", "#4fd1d9", "#c7d36b"];
  const KNOWN = { Engineering: 0, Tech: 1, Learning: 2, Fun: 3 };
  function colorFor(cat) {
    if (cat in KNOWN) return PALETTE[KNOWN[cat]];
    let h = 0;
    for (const ch of String(cat)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function fmtDuration(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }

  function fmtDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  function loadWatched(key) {
    try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch { return new Set(); }
  }
  function saveWatched(key, set) {
    try { localStorage.setItem(key, JSON.stringify([...set])); } catch {}
  }

  const $ = (id) => document.getElementById(id);

  function showStatus(text) {
    $("status").textContent = text;
    $("status").hidden = false;
  }

  async function init() {
    let feed;
    try {
      const res = await fetch(`feed.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      feed = await res.json();
    } catch (e) {
      $("progress-label").textContent = "";
      showStatus("Couldn't load today's feed. Try refreshing.");
      return;
    }

    const videos = feed.videos || [];
    const key = `watched:${feed.date}`;
    const watched = loadWatched(key);
    $("date").textContent = feed.date ? fmtDate(feed.date) : "";

    function update() {
      const n = videos.length;
      const x = videos.filter((v) => watched.has(v.id)).length;
      $("progress-label").textContent = `${x} of ${n} watched`;
      $("bar").style.width = n ? `${(x / n) * 100}%` : "0";
      $("done").hidden = !(n && x === n);
    }

    if (!videos.length) {
      update();
      showStatus("No picks today. Check back tomorrow morning.");
      return;
    }

    const grid = $("grid");
    for (const v of videos) {
      const a = document.createElement("a");
      a.className = "card" + (watched.has(v.id) ? " watched" : "");
      a.href = `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`;
      a.target = "_blank";
      a.rel = "noopener";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = v.thumb || `https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg`;
      img.alt = "";
      img.loading = "lazy";
      thumb.append(img);
      const dur = fmtDuration(v.seconds);
      if (dur) {
        const badge = document.createElement("span");
        badge.className = "duration";
        badge.textContent = dur;
        thumb.append(badge);
      }
      const check = document.createElement("div");
      check.className = "check";
      check.innerHTML = '<span aria-hidden="true">✓</span>';
      thumb.append(check);

      const body = document.createElement("div");
      body.className = "body";
      const title = document.createElement("h2");
      title.className = "title";
      title.textContent = v.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      const channel = document.createElement("span");
      channel.className = "channel";
      channel.textContent = v.channel;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = v.category;
      chip.style.color = colorFor(v.category);
      meta.append(channel, chip);
      body.append(title, meta);

      a.append(thumb, body);
      a.addEventListener("click", () => {
        watched.add(v.id);
        saveWatched(key, watched);
        a.classList.add("watched");
        update();
      });
      grid.append(a);
    }
    update();
  }

  init();
</script>
</body>
</html>
