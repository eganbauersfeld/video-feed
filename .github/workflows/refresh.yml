name: Refresh feed

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-feed.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit today's feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json history.json
          git diff --cached --quiet || git commit -m "Feed for $(date -u +%F)"
          git push
