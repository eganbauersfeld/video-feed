# Offline judge mode only: a scheduled Claude Code session commits picks.json,
# and this turns it into feed.json.
name: Assemble feed

on:
  push:
    paths: ["picks.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/assemble.mjs
      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          for f in feed.json seen.json rosters.json queries.json cache; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Assemble feed for $(TZ=America/Denver date +%F)"
          git push
